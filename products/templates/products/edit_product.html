<!DOCTYPE html>
<html>
<head>
    <title>Edit Product</title>
</head>
<body>

<h1>Edit Product</h1>

<form method="POST">
    {% csrf_token %}

    Product ID:<br>
    <input type="text" name="product_id" value="{{ product.product_id }}"><br><br>

    Product Name:<br>
    <input type="text" name="product_name" value="{{ product.product_name }}"><br><br>

    Price:<br>
    <input type="number" step="0.01" name="price" value="{{ product.price }}"><br><br>

    Quantity:<br>
    <input type="number" name="quantity" value="{{ product.quantity }}"><br><br>

    <button type="submit">Update Product</button>

</form>

<br>

<a href="/products/view/">Back to Products</a>

</body>
</html>
