{% extends "base.html" %}

{% block content %}

<div class="container mt-4">

<h2>Add Product</h2>

<hr>

<form method="POST">

{% csrf_token %}

<div class="mb-3">

<label>Product</label>

<select
name="product"
class="form-control"
required>

<option value="">Select Product</option>

{% for product in products %}

<option value="{{ product.id }}">

{{ product.product_name }}

</option>

{% endfor %}

</select>

</div>

<div class="mb-3">

<label>Quantity</label>

<input
type="number"
name="quantity"
class="form-control"
required>

</div>

<button
type="submit"
class="btn btn-success">

Add Product

</button>

</form>

</div>

{% endblock %}
