{% extends "base.html" %}

{% block content %}

<div class="container mt-4">

    <h2>New Purchase</h2>

    <hr>

    <form method="POST">

        {% csrf_token %}

        <div class="mb-3">
            <label>Purchase Number</label>
            <input type="text"
                   name="purchase_no"
                   class="form-control"
                   required>
        </div>

        <div class="mb-3">
            <label>Supplier</label>

            <select name="supplier"
                    class="form-control"
                    required>

                <option value="">Select Supplier</option>

                {% for supplier in suppliers %}

                <option value="{{ supplier.id }}">
                    {{ supplier.supplier_name }}
                </option>

                {% endfor %}

            </select>

        </div>

        <button type="submit"
                class="btn btn-success">

            Create Purchase

        </button>

    </form>

</div>

{% endblock %}
