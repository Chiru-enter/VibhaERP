<!DOCTYPE html>
<html>
<head>
    <title>Vibha ERP</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        body{
            margin:0;
            background:#f8f9fa;
        }

        .sidebar{
            width:250px;
            height:100vh;
            background:#212529;
            position:fixed;
            padding-top:20px;
        }

        .sidebar h3{
            color:white;
            text-align:center;
            margin-bottom:20px;
        }

        .sidebar a{
            color:white;
            display:block;
            padding:12px 20px;
            text-decoration:none;
        }

        .sidebar a:hover{
            background:#0d6efd;
        }

        .content{
            margin-left:250px;
            padding:30px;
        }

        .topbar{
            background:#0d6efd;
            color:white;
            padding:15px;
            margin-bottom:20px;
        }

        /* ---------- PRINT SETTINGS ---------- */

        @media print {

            .sidebar{
                display:none !important;
            }

            .topbar{
                display:none !important;
            }

            .btn{
                display:none !important;
            }

            .alert{
                display:none !important;
            }

            .content{
                margin-left:0 !important;
                padding:10px !important;
            }

            body{
                background:white !important;
            }

        }

    </style>

</head>

<body>

<div class="sidebar">

    <h3>Vibha ERP</h3>

    <a href="/dashboard/">🏠 Dashboard</a>

    <!-- CRM -->
    <a href="/crm/">🤝 CRM</a>

    <a href="/products/">📦 Products</a>
    <a href="/customers/">👥 Customers</a>
    <a href="/suppliers/">🏢 Suppliers</a>

    <a href="{% url 'inventory_dashboard' %}">
        📦 Inventory
    </a>

    <a href="{% url 'sales_dashboard' %}">
        🧾 Sales
    </a>

    <a href="{% url 'purchase_dashboard' %}">
        📦 Purchase
    </a>

    <a href="{% url 'reports_dashboard' %}">
        📊 Reports
    </a>

</div>

<div class="content">

    <div class="topbar">
        <h4>Business ERP System</h4>
    </div>

    {% if messages %}
    <div class="container mt-3">
        {% for message in messages %}
            <div class="alert alert-{{ message.tags }}">
                {{ message }}
            </div>
        {% endfor %}
    </div>
    {% endif %}

    {% block content %}
    {% endblock %}

</div>

</body>
</html>
