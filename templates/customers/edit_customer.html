{% extends "base.html" %}

{% block content %}

<div class="container mt-4">

<div class="card shadow">

<div class="card-header bg-warning">
<h3>Edit Customer</h3>
</div>

<div class="card-body">

<form method="POST">

{% csrf_token %}

<div class="mb-3">
<label>Customer ID</label>
<input type="text" name="customer_id" value="{{ customer.customer_id }}" class="form-control" required>
</div>

<div class="mb-3">
<label>Customer Name</label>
<input type="text" name="customer_name" value="{{ customer.customer_name }}" class="form-control" required>
</div>

<div class="mb-3">
<label>Contact Person</label>
<input type="text" name="contact_person" value="{{ customer.contact_person }}" class="form-control" required>
</div>

<div class="mb-3">
<label>Phone</label>
<input type="text" name="phone" value="{{ customer.phone }}" class="form-control" required>
</div>

<div class="mb-3">
<label>Email</label>
<input type="email" name="email" value="{{ customer.email }}" class="form-control" required>
</div>

<div class="mb-3">
<label>Address</label>
<textarea name="address" class="form-control" rows="3">{{ customer.address }}</textarea>
</div>

<button type="submit" class="btn btn-success">
Update Customer
</button>

<a href="{% url 'view_customers' %}" class="btn btn-secondary">
Cancel
</a>

</form>

</div>

</div>

</div>

{% endblock %}
