{% extends "base.html" %}

{% block content %}

<div class="container-fluid mt-4">

    <div class="d-flex justify-content-between align-items-center mb-4">

        <div>
            <h2 class="fw-bold">New Enquiry</h2>
            <p class="text-muted mb-0">
                Create a new customer enquiry
            </p>
        </div>

        <a href="{% url 'crm_dashboard' %}"
           class="btn btn-secondary">

            ← Back to CRM

        </a>

    </div>


    <div class="card shadow-sm border-0">

        <div class="card-header bg-primary text-white">

            <h5 class="mb-0">
                Enquiry Details
            </h5>

        </div>


        <div class="card-body">

            <form method="POST"
                  enctype="multipart/form-data">

                {% csrf_token %}


                <!-- BASIC DETAILS -->

                <h5 class="mb-3">
                    Basic Information
                </h5>

                <div class="row">

                    <div class="col-md-6 mb-3">

                        <label class="form-label">
                            Enquiry Number *
                        </label>

                        <input type="text"
                               name="enquiry_no"
                               class="form-control"
                               placeholder="ENQ-2608-001"
                               required>

                    </div>


                    <div class="col-md-6 mb-3">

                        <label class="form-label">
                            Customer *
                        </label>

                        <select name="customer"
                                class="form-select"
                                required>

                            <option value="">
                                -- Select Customer --
                            </option>

                            {% for customer in customers %}

                                <option value="{{ customer.id }}">
                                    {{ customer.customer_name }}
                                </option>

                            {% empty %}

                                <option value="">
                                    No customers available
                                </option>

                            {% endfor %}

                        </select>

                    </div>


                    <div class="col-md-6 mb-3">

                        <label class="form-label">
                            Company
                        </label>

                        <input type="text"
                               name="company"
                               class="form-control">

                    </div>


                    <div class="col-md-6 mb-3">

                        <label class="form-label">
                            Contact Person
                        </label>

                        <input type="text"
                               name="contact_person"
                               class="form-control">

                    </div>


                    <div class="col-md-6 mb-3">

                        <label class="form-label">
                            Phone
                        </label>

                        <input type="text"
                               name="phone"
                               class="form-control">

                    </div>


                    <div class="col-md-6 mb-3">

                        <label class="form-label">
                            Email
                        </label>

                        <input type="email"
                               name="email"
                               class="form-control">

                    </div>


                    <div class="col-md-6 mb-3">

                        <label class="form-label">
                            City
                        </label>

                        <input type="text"
                               name="city"
                               class="form-control">

                    </div>


                    <div class="col-md-6 mb-3">

                        <label class="form-label">
                            Project Name *
                        </label>

                        <input type="text"
                               name="project_name"
                               class="form-control"
                               placeholder="Example: 9m Street Light Project"
                               required>

                    </div>

                </div>


                <hr class="my-4">


                <!-- SALES DETAILS -->

                <h5 class="mb-3">
                    Sales Information
                </h5>

                <div class="row">

                    <div class="col-md-6 mb-3">

                        <label class="form-label">
                            Sales Executive
                        </label>

                        <input type="text"
                               name="sales_executive"
                               class="form-control">

                    </div>


                    <div class="col-md-6 mb-3">

                        <label class="form-label">
                            Expected Value
                        </label>

                        <div class="input-group">

                            <span class="input-group-text">
                                ₹
                            </span>

                            <input type="number"
                                   name="expected_value"
                                   class="form-control"
                                   step="0.01"
                                   min="0"
                                   value="0">

                        </div>

                    </div>


                    <div class="col-md-6 mb-3">

                        <label class="form-label">
                            Expected Closing Date
                        </label>

                        <input type="date"
                               name="expected_closing_date"
                               class="form-control">

                    </div>


                    <div class="col-md-6 mb-3">

                        <label class="form-label">
                            Lead Source
                        </label>

                        <select name="lead_source"
                                class="form-select">

                            <option value="Website">
                                Website
                            </option>

                            <option value="Dealer">
                                Dealer
                            </option>

                            <option value="Architect">
                                Architect
                            </option>

                            <option value="Tender">
                                Tender
                            </option>

                            <option value="Walk-in">
                                Walk-in
                            </option>

                        </select>

                    </div>


                    <div class="col-md-6 mb-3">

                        <label class="form-label">
                            Status
                        </label>

                        <select name="status"
                                class="form-select">

                            <option value="New">
                                New
                            </option>

                            <option value="Follow-up">
                                Follow-up
                            </option>

                            <option value="Quotation">
                                Quotation
                            </option>

                            <option value="Won">
                                Won
                            </option>

                            <option value="Lost">
                                Lost
                            </option>

                        </select>

                    </div>

                </div>


                <hr class="my-4">


                <!-- NOTES -->

                <h5 class="mb-3">
                    Additional Information
                </h5>

                <div class="mb-3">

                    <label class="form-label">
                        Notes / Requirements
                    </label>

                    <textarea name="notes"
                              class="form-control"
                              rows="5"
                              placeholder="Enter customer requirements, specifications, remarks, etc."></textarea>

                </div>


                <!-- DRAWING -->

                <div class="mb-4">

                    <label class="form-label">
                        Drawing / Document
                    </label>

                    <input type="file"
                           name="drawing"
                           class="form-control">

                    <small class="text-muted">
                        Upload relevant customer drawing or document.
                    </small>

                </div>


                <!-- BUTTONS -->

                <div class="d-flex gap-2">

                    <button type="submit"
                            class="btn btn-success">

                        Save Enquiry

                    </button>


                    <a href="{% url 'crm_dashboard' %}"
                       class="btn btn-secondary">

                        Cancel

                    </a>

                </div>

            </form>

        </div>

    </div>

</div>

{% endblock %}
