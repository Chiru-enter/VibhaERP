<!DOCTYPE html>
<html>
<head>
    <title>Login</title>
    <style>
        body{
            font-family: Arial;
            background:#f2f2f2;
        }

        .box{
            width:350px;
            margin:100px auto;
            background:white;
            padding:30px;
            border-radius:10px;
            box-shadow:0 0 10px gray;
        }

        h1{
            text-align:center;
        }

        input{
            width:100%;
            padding:10px;
            margin-top:8px;
            margin-bottom:15px;
        }

        button{
            width:100%;
            padding:10px;
            background:#007BFF;
            color:white;
            border:none;
            border-radius:5px;
            font-size:16px;
        }

        button:hover{
            background:#0056b3;
        }
    </style>
</head>

<body>

<div class="box">

<h1>Login</h1>

<form method="POST">
    {% csrf_token %}

    <label>Username</label>
    <input type="text" name="username">

    <label>Password</label>
    <input type="password" name="password">

    {% if error %}
    <p style="color:red;">{{ error }}</p>
    {% endif %}

    <button type="submit">Login</button>
</form>



</div>

</body>
</html>
